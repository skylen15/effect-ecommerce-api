# ============================================
# Effect E-commerce API - Docker Compose
# ============================================
#
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose up api         # Start API only (requires external DB)
#   docker-compose logs -f api    # View API logs
#   docker-compose down           # Stop all services
#
# Access:
#   API:        http://localhost:3000
#   API Docs:   http://localhost:3000/docs
#   Grafana:    http://localhost:3001 (admin/admin)
# ============================================

services:
    # ----------------------------------------
    # E-commerce API
    # ----------------------------------------
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: ecommerce-api
        ports:
            - "${PORT:-3000}:${PORT:-3000}"
        environment:
            # Server
            - PORT=${PORT:-3000}
            - NODE_ENV=production

            # Database (use your cloud database URL)
            - DATABASE_URL=${DATABASE_URL}

            # Authentication
            - AUTH_JWKS_URL=${AUTH_JWKS_URL}
            - AUTH_ISSUER=${AUTH_ISSUER}
            - AUTH_AUDIENCE=${AUTH_AUDIENCE}

            # OpenTelemetry
            - OTEL_ENABLED=${OTEL_ENABLED:-true}
            - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-ecommerce-api}
            - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-1.0.0}
            - OTEL_EXPORTER=${OTEL_EXPORTER:-otlp}
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4318/v1/traces
        depends_on:
            tempo:
                condition: service_started
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD",
                    "bun",
                    "--eval",
                    "fetch('http://localhost:' + (process.env.PORT || 3000) + '/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s

    # ----------------------------------------
    # Grafana - Visualization & Dashboards
    # ----------------------------------------
    grafana:
        image: grafana/grafana:latest
        container_name: grafana
        ports:
            - "3001:3000"
        environment:
            - GF_SECURITY_ADMIN_USER=admin
            - GF_SECURITY_ADMIN_PASSWORD=admin
            - GF_USERS_ALLOW_SIGN_UP=false
            - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
        volumes:
            - ./observability/grafana/provisioning:/etc/grafana/provisioning
            - grafana-data:/var/lib/grafana
        depends_on:
            - tempo
            - loki
            - prometheus
        restart: unless-stopped

    # ----------------------------------------
    # Tempo - Distributed Tracing
    # ----------------------------------------
    tempo:
        image: grafana/tempo:latest
        container_name: tempo
        command: ["-config.file=/etc/tempo.yaml"]
        ports:
            # Tempo API
            - "3200:3200"
            # OTLP HTTP
            - "4318:4318"
            # OTLP gRPC
            - "4317:4317"
        volumes:
            - ./observability/tempo/tempo.yaml:/etc/tempo.yaml:ro
            - tempo-data:/var/tempo
        restart: unless-stopped

    # ----------------------------------------
    # Loki - Log Aggregation
    # ----------------------------------------
    loki:
        image: grafana/loki:latest
        container_name: loki
        command: ["-config.file=/etc/loki/local-config.yaml"]
        ports:
            - "3100:3100"
        volumes:
            - ./observability/loki/loki.yaml:/etc/loki/local-config.yaml:ro
            - loki-data:/loki
        restart: unless-stopped

    # ----------------------------------------
    # Prometheus - Metrics
    # ----------------------------------------
    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-remote-write-receiver"
            - "--enable-feature=exemplar-storage"
        ports:
            - "9090:9090"
        volumes:
            - ./observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
            - prometheus-data:/prometheus
        restart: unless-stopped

# ============================================
# Volumes
# ============================================
volumes:
    grafana-data:
    tempo-data:
    loki-data:
    prometheus-data:

# ============================================
# Networks
# ============================================
networks:
    default:
        name: ecommerce-network
